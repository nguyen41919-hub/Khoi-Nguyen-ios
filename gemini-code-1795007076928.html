<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS ACC - Shop Acc Game Tự Động Uy Tín</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        darkCard: '#131c2e',
                        darkBorder: '#1e293b',
                        neonCyan: '#06b6d4',
                        neonPurple: '#8b5cf6'
                    }
                }
            }
        }
    </script>
    <style>
        .neon-glow {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.25);
        }
        .neon-glow-purple {
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.25);
        }
        .text-glow {
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-cyan-500 selection:text-white">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-darkBg/90 backdrop-blur-md border-b border-darkBorder">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="location.reload()">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center neon-glow">
                    <i class="fa-solid fa-gamepad text-white text-xl"></i>
                </div>
                <div>
                    <span class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500 text-glow">NEXUS ACC</span>
                    <span class="block text-[10px] text-cyan-400 font-semibold tracking-widest uppercase">Giao Dịch Tự Động 24/7</span>
                </div>
            </div>

            <div class="flex items-center space-x-4">
                <button onclick="openDepositModal()" class="hidden sm:flex items-center space-x-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white px-4 py-2 rounded-xl font-medium transition shadow-lg shadow-emerald-900/30">
                    <i class="fa-solid fa-wallet"></i>
                    <span>Nạp Tiền QR</span>
                </button>

                <div class="bg-darkCard border border-darkBorder px-4 py-2 rounded-xl flex items-center space-x-2">
                    <i class="fa-solid fa-coins text-yellow-400"></i>
                    <span class="text-sm font-bold text-yellow-400" id="userBalance">2,000,000đ</span>
                </div>

                <button onclick="openAdminModal()" class="bg-darkCard hover:bg-darkBorder border border-purple-500/50 text-purple-400 hover:text-purple-300 px-4 py-2 rounded-xl font-medium transition flex items-center space-x-2">
                    <i class="fa-solid fa-user-shield"></i>
                    <span class="hidden md:inline">Quản Trị Shop</span>
                </button>
            </div>
        </div>
    </header>

    <!-- BANNER -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 w-full">
        <div class="relative rounded-3xl overflow-hidden bg-gradient-to-r from-blue-900/40 via-purple-900/40 to-slate-900 border border-darkBorder p-8 md:p-12 flex flex-col md:flex-row items-center justify-between">
            <div class="max-w-xl z-10 mb-6 md:mb-0">
                <span class="bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Hệ Thống Uy Tín No.1</span>
                <h1 class="text-3xl md:text-5xl font-extrabold mt-4 mb-3 tracking-tight">Shop Acc Game <span class="text-cyan-400">Tự Động 24/7</span></h1>
                <p class="text-slate-400 text-sm md:text-base mb-6">Tài khoản chuẩn trắng thông tin, đúng mô tả, đổi mật khẩu 100% qua email/sđt chính chủ sau khi mua.</p>
                <div class="flex flex-wrap gap-4">
                    <a href="#shopSection" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold px-6 py-3 rounded-xl transition neon-glow">Khám Phá Ngay</a>
                    <button onclick="openDepositModal()" class="bg-darkCard hover:bg-darkBorder border border-darkBorder text-slate-200 font-bold px-6 py-3 rounded-xl transition">Nạp Tiền Ngân Hàng</button>
                </div>
            </div>
            <div class="relative z-10 w-48 md:w-72 h-48 md:h-72 flex items-center justify-center">
                <div class="absolute inset-0 bg-gradient-to-tr from-cyan-500/20 to-purple-500/25 rounded-full blur-2xl"></div>
                <i class="fa-solid fa-shield-halved text-8xl md:text-9xl text-transparent bg-clip-text bg-gradient-to-tr from-cyan-400 to-purple-500"></i>
            </div>
        </div>
    </section>

    <!-- SHOP SECTION -->
    <main id="shopSection" class="max
